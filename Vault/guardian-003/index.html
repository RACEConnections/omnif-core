<!DOCTYPE html>
<html lang="en">
    <script>
    // R.A.C.E. LLC PROTOCOL: STRICT DEVICE & PAYMENT VERIFICATION
    (function enforceAccess() {
        // 1. Database Flag (Change this to 'true' ONLY when Uncle Joe pays)
        const treasuryCleared = false; 

        // 2. Check for the Master Key on the device loading the page
        const isCustodianDevice = localStorage.getItem('saciphub_master_custodian') === 'authorized_architect';

        if (!treasuryCleared) {
            // The node is unpaid. 
            if (isCustodianDevice) {
                // It is your Infinix. Grant access for the demo and setup.
                console.log("CUSTODIAN OVERRIDE ACTIVE. Pre-payment access granted to Architect.");
            } else {
                // It is Uncle Joe's computer (or his boy's phone), and he hasn't paid yet.
                // Erase the screen and show the Treasury Lock.
                document.addEventListener("DOMContentLoaded", () => {
                    document.body.innerHTML = `
                        <div style="background: #0a0c10; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Courier New', monospace; text-align: center; padding: 20px;">
                            <h1 style="color: #d32f2f; margin-bottom: 10px;">NODE LOCKED</h1>
                            <p style="color: #8892b0; max-width: 400px; line-height: 1.5; margin-bottom: 20px;">
                                Local architecture deployment confirmed. Zero-Knowledge Cloud Sync and UI access are pending.<br><br>
                                <strong>Treasury Clearance (₦30,000) required to ignite this node.</strong>
                            </p>
                            <p style="font-size: 11px; color: #555;">SACIPHUB | PROTOCOL 01</p>
                        </div>
                    `;
                });
            }
        }
    })();
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol 01 | Universal Gateway</title>
    <style>
        /* Keeping the exact premium dark-mode styling we established */
        :root { --primary-green: #005a32; --dark-slate: #0a0c10; --panel-bg: #151921; --text-light: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--dark-slate); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .gateway-container { background-color: var(--panel-bg); padding: 40px; border-radius: 8px; border-top: 4px solid var(--primary-green); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
        .crest { font-size: 22px; font-weight: bold; margin-bottom: 30px; font-family: 'Segoe UI', sans-serif; }
        .crest span { color: var(--primary-green); }
        .input-group input { width: 100%; padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none; text-transform: uppercase; }
        .input-group input:focus { border-color: var(--primary-green); }
        .btn-auth { width: 100%; background: var(--primary-green); color: #fff; padding: 16px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; }
        .error-msg { color: #ff4c4c; font-size: 12px; margin-top: 15px; min-height: 15px; }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="crest">R.A.C.E. <span>LLC</span></div>
        <div style="font-size: 12px; color: #8892b0; margin-bottom: 25px; text-transform: uppercase;">Universal Node Routing</div>

        <div class="input-group">
            <input type="text" id="access-key" placeholder="INPUT ENGRAVED KEY (e.g., VANGUARD-001)" autocomplete="off">
        </div>

        <button class="btn-auth" onclick="routeNode()">Authorize & Route</button>
        <div id="error-display" class="error-msg"></div>
    </div>

    <script>
        function routeNode() {
            // 1. Capture and format the input
            let rawKey = document.getElementById('access-key').value.trim().toUpperCase();
            const errorDisplay = document.getElementById('error-display');
            errorDisplay.innerText = "";

            // 2. Multi-Tenant Validation Logic
            // The system ensures the key starts with "VANGUARD-" and has at least 3 numbers
            if (rawKey.startsWith("VANGUARD-") && rawKey.length >= 12) {
                
                // 3. Set Universal Security Cookies (For middleware.js to allow entry)
                localStorage.setItem('vanguard_chairman_key_active', 'true');
                document.cookie = "chairman_auth_token=verified; path=/; max-age=86400; Secure; SameSite=Strict";
                
                document.querySelector('.btn-auth').innerText = "ROUTING TO NODE...";
                document.querySelector('.btn-auth').style.backgroundColor = "#555";
                
                // 4. THE DYNAMIC ROUTER
                // If Uncle Joe types GUARDIAN-001, he goes to /vault/guardian-001/
                // If a new client types GUARDIAN-002, he goes to /vault/guardian-002/
                const folderPath = rawKey.toLowerCase(); 
                
                setTimeout(() => {
                    window.location.href = `/vault/${folderPath}/`;
                }, 1500);

            } else {
                errorDisplay.innerText = "ROUTING FAILED: INVALID GUARDIAN KEY.";
                document.getElementById('access-key').value = "";
            }
        }
    </script>
</body>
</html>
