<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol 01 | The Chairman Vault</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        :root { --primary-green: #005a32; --dark-slate: #1a1f24; --light-bg: #f4f6f8; --text-main: #333333; --border: #e0e4e8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        .top-nav { background-color: var(--dark-slate); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-green); }
        .nav-title { color: #fff; font-weight: bold; letter-spacing: 1px; }
        .nav-title span { color: var(--primary-green); }

        .dashboard-container { flex-grow: 1; padding: 30px 5%; max-width: 900px; margin: 0 auto; width: 100%; }
        
        .header-panel { background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 25px; border-left: 5px solid var(--primary-green); }
        .header-panel h2 { color: var(--dark-slate); margin-bottom: 5px; }
        .header-panel p { font-size: 14px; color: #666; }

        .vault-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .input-card { background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 3px solid var(--dark-slate); }
        .input-card h3 { font-size: 16px; color: var(--dark-slate); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; outline: none; background: #fdfdfd; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-green); }
        
        .btn-encrypt { width: 100%; background: var(--dark-slate); color: #fff; padding: 15px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-encrypt:hover { background: #000; }
        .btn-encrypt span { color: var(--primary-green); }

        .ledger-card { background: #fff; padding: 25px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border-top: 3px solid var(--primary-green); }
        .ledger-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .ledger-item:last-child { border-bottom: none; }
        .badge { font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .badge-internal { background: #e3f2fd; color: #1565c0; }
        .badge-external { background: #fff3e0; color: #e65100; }
        .badge-locked { background: #e8f5e9; color: var(--primary-green); }

        @media (max-width: 768px) { .vault-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-title">PROTOCOL 01 <span>| CHAIRMAN VAULT</span></div>
        <div style="color: #888; font-size: 12px;">Zero-Knowledge Active</div>
    </div>

    <div class="dashboard-container">
        
        <div class="header-panel">
            <h2>Physical Showroom Alignment</h2>
            <p>Neatly arrange your assets across your internal showroom and external storage before triggering the Zero-Knowledge Vault lock.</p>
        </div>

        <div class="vault-grid">
            
            <div class="input-card">
                <h3>Align New Asset</h3>
                
                <div class="form-group">
                    <label>Industry Category</label>
                    <select id="asset-category">
                        <option value="TECH">Technology / Electronics (Monitors, Cables)</option>
                        <option value="FURNITURE">Furniture / Decor (Sofas, Desks)</option>
                        <option value="APPLIANCE">Heavy Appliances (AC Units, Fridges)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Exact Asset Description</label>
                    <input type="text" id="asset-name" placeholder="e.g., Dell 24-inch Monitor">
                </div>

                <div class="form-group">
                    <label>Service Chain Location</label>
                    <select id="asset-location">
                        <option value="INTERNAL">Internal (Physical Showroom Floor)</option>
                        <option value="EXTERNAL">External (Back Warehouse / Depot)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Capital Value (₦)</label>
                    <input type="number" id="asset-value" placeholder="Enter monetary value">
                </div>

                <button class="btn-encrypt" onclick="encryptAndLog()">
                    🔒 <span>ALIGN & ENCRYPT TO VAULT</span>
                </button>
            </div>

            <div class="ledger-card">
                <h3 style="font-size: 16px; color: var(--dark-slate); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Encrypted Ledger Backup</h3>
                
                <div id="ledger-list">
                    <div style="text-align: center; color: #888; font-size: 13px; margin-top: 20px;">
                        Awaiting structural alignment...
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- ZERO-KNOWLEDGE SIMULATION & UI LOGIC ---
        // In a live production environment, this function would use AES-256 to hash the data before sending to Firebase.
        
        function encryptAndLog() {
            const category = document.getElementById('asset-category').value;
            const name = document.getElementById('asset-name').value;
            const location = document.getElementById('asset-location').value;
            const value = document.getElementById('asset-value').value;

            if(!name || !value) {
                alert("Protocol Error: Asset description and value must be aligned before encryption.");
                return;
            }

            // Simulate the Zero-Knowledge Encryption process visually for the client
            const list = document.getElementById('ledger-list');
            
            // Clear empty state message if it exists
            if(list.innerHTML.includes("Awaiting structural alignment")) {
                list.innerHTML = '';
            }

            // Determine badge color based on Internal/External selection
            const badgeClass = location === 'INTERNAL' ? 'badge-internal' : 'badge-external';
            const locationText = location === 'INTERNAL' ? 'Showroom' : 'Warehouse';

            // Create the new log item showing the "encrypted" state
            const newItem = document.createElement('div');
            newItem.className = 'ledger-item';
            newItem.innerHTML = `
                <div>
                    <strong>${name}</strong> <br>
                    <span style="font-size: 11px; color: #888;">Hash: ***${Math.random().toString(36).substring(2, 10).toUpperCase()}***</span>
                </div>
                <div style="text-align: right;">
                    <span class="badge ${badgeClass}">${locationText}</span><br>
                    <span class="badge badge-locked" style="margin-top: 5px; display: inline-block;">Vault Locked</span>
                </div>
            `;

            // Add to top of the ledger
            list.prepend(newItem);

            // Reset inputs
            document.getElementById('asset-name').value = '';
            document.getElementById('asset-value').value = '';

            // This is where you hand the phone back to Uncle Joe and say:
            // "The data is aligned, the hash is generated, and the vault is locked. No one sees this but you."
        }
    </script>
</body>
</html>
