<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocol 01 Engine | VCI</title>
    <style>
        :root { --primary-green: #005a32; --dark-slate: #1a1f24; --light-bg: #f4f6f8; --text-main: #333333; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }
        
        .top-nav { background-color: var(--dark-slate); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { color: #fff; text-decoration: none; font-size: 14px; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; }
        .back-btn:hover { border-color: var(--primary-green); }
        .nav-title { color: var(--primary-green); font-weight: bold; letter-spacing: 1px; }

        .dashboard-container { flex-grow: 1; padding: 40px 5%; display: flex; flex-direction: column; align-items: center; }
        .auth-card { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid var(--primary-green); }
        
        .auth-card h2 { color: var(--dark-slate); margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        .form-group input:focus { border-color: var(--primary-green); }
        
        .btn-submit { width: 100%; background: var(--primary-green); color: #fff; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        footer { text-align: center; padding: 20px; font-size: 12px; color: #888; background: #fff; }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="https://protocolx.one" class="back-btn">← Main Hub</a>
        <div class="nav-title">VCI ENGINE</div>
    </div>

    <div class="dashboard-container">
        <div class="auth-card">
            <h2>Secure Ledger Access</h2>
            <div class="form-group">
                <label>Entity ID / Warehouse Node</label>
                <input type="text" placeholder="Enter Registration ID">
            </div>
            <div class="form-group">
                <label>Security Protocol (Password)</label>
                <input type="password" placeholder="Enter Password">
            </div>
            <button class="btn-submit">INITIALIZE LEDGER</button>
        </div>
    </div>
    <footer>&copy; 2026 R.A.C.E. LLC. Protocol 01 Dashboard.</footer>
</body>
</html>
